name: Deploy Backend to Azure App Service - travel-planner-rg-api

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_travel-planner-rg-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-planner-rg-api-production
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: travel-planner-rg-api
  BACKEND_PATH: backend
  NODE_VERSION: "24.x"

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend package
        working-directory: ${{ env.BACKEND_PATH }}
        run: |
          test -f package.json || {
            echo "::error::backend/package.json was not found"
            exit 1
          }

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_PATH }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build backend
        working-directory: ${{ env.BACKEND_PATH }}
        run: npm run build --if-present

      - name: Verify publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TRAVEL_PLANNER_RG_API }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Missing repository secret: AZURE_WEBAPP_PUBLISH_PROFILE_TRAVEL_PLANNER_RG_API"
            exit 1
          fi

      - name: Deploy backend to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TRAVEL_PLANNER_RG_API }}
          package: ./${{ env.BACKEND_PATH }}
