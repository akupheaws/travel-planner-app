name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps-black-wave-0e203db10.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps-black-wave-0e203db10.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: travel-planner-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Static Web Apps deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Missing repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10"
            exit 1
          fi

      - name: Build and deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./frontend
          api_location: ""
          output_location: dist

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Close Pull Request Environment
    runs-on: ubuntu-latest

    steps:
      - name: Verify Static Web Apps deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Missing repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10"
            exit 1
          fi

      - name: Close pull request deployment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WAVE_0E203DB10 }}
          action: close
